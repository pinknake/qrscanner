<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro QR Scanner</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

header{
padding:15px;
font-size:20px;
font-weight:bold;
background:#1e293b;
}

#reader{
width:90%;
margin:20px auto;
border-radius:15px;
overflow:hidden;
}

.controls{
margin:10px;
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
opacity:0.8;
}

#result{
margin:15px;
padding:15px;
background:#1e293b;
border-radius:10px;
word-wrap:break-word;
}

.action-btn {
display:block;
width:90%;
margin:8px auto;
padding:12px;
border:none;
border-radius:10px;
background:#1a73e8;
color:white;
font-size:16px;
cursor:pointer;
}

#installBtn{
display:none;
background:#16a34a;
}

.sidebar {
position:fixed;
right:0;
top:0;
width:240px;
height:100%;
overflow-y:auto;
background:#111;
padding:10px;
}

.history-item {
background:#1f1f1f;
padding:8px;
margin-bottom:8px;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.history-item:hover{
background:#2a2a2a;
}
</style>
</head>

<body>

<header>🚀 Pro QR Scanner</header>

<div id="reader"></div>

<div class="controls">
<button onclick="toggleFlash()">🔦 Flash</button>
<button onclick="switchCamera()">🔄 Camera</button>
<button onclick="scanFromGallery()">🖼 Gallery</button>
<button id="installBtn">📲 Install</button>
</div>

<div id="result">Scan Result Will Appear Here</div>
<div id="actions"></div>


<script>
let html5QrCode;
let currentCameraId = null;
let cameras = [];
let scanHistory = JSON.parse(localStorage.getItem("scanHistory")) || [];
let deferredPrompt = null;
let scannerRunning = false;

/* ---------------- PWA INSTALL ---------------- */

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "inline-block";
});

document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

/* ---------------- INIT SCANNER ---------------- */

async function initScanner() {
  try {
    html5QrCode = new Html5Qrcode("reader");
    cameras = await Html5Qrcode.getCameras();
    if (cameras.length > 0) {
      currentCameraId = cameras[0].id;
      startScanner();
    } else {
      document.getElementById("result").innerHTML = "No camera found";
    }
  } catch (err) {
    document.getElementById("result").innerHTML = "Camera error";
    console.error(err);
  }
}

async function startScanner() {
  if (scannerRunning) return;
  try {
    await html5QrCode.start(
      currentCameraId,
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
    scannerRunning = true;
  } catch (err) {
    console.error("Start error:", err);
  }
}

async function stopScanner() {
  if (!scannerRunning) return;
  await html5QrCode.stop();
  scannerRunning = false;
}

/* ---------------- SCAN SUCCESS ---------------- */

async function onScanSuccess(decodedText) {
  await stopScanner();
  handleResult(decodedText);
}

/* ---------------- FLASH ---------------- */

async function toggleFlash() {
  try {
    await html5QrCode.applyVideoConstraints({
      advanced: [{ torch: true }]
    });
  } catch {
    alert("Flash not supported on this device");
  }
}

/* ---------------- CAMERA SWITCH ---------------- */

async function switchCamera() {
  if (cameras.length < 2) return;

  await stopScanner();

  const index = cameras.findIndex(cam => cam.id === currentCameraId);
  const nextIndex = (index + 1) % cameras.length;
  currentCameraId = cameras[nextIndex].id;

  startScanner();
}

/* ---------------- GALLERY SCAN ---------------- */

function scanFromGallery() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";

  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    html5QrCode.scanFile(file, true)
      .then(decodedText => handleResult(decodedText))
      .catch(() => alert("No QR found in image"));
  };

  input.click();
}

/* ---------------- AI TYPE DETECTION ---------------- */

function analyzeQR(data) {
  const d = data.toLowerCase();
  if (d.startsWith("http")) return "🌐 Website";
  if (d.startsWith("upi://")) return "💰 UPI Payment";
  if (/^\+?\d{8,15}$/.test(data)) return "📞 Phone Number";
  if (d.includes("@")) return "📧 Email";
  return "📝 Text";
}

/* ---------------- RESULT HANDLING ---------------- */

function handleResult(data) {
  const type = analyzeQR(data);

  document.getElementById("result").innerHTML =
    `<b>Result:</b><br>${escapeHtml(data)}<br><br><b>Type:</b> ${type}`;

  createActions(data);
  saveHistory(data, type);
  renderHistory();
}

/* ---------------- SAFE HTML ESCAPE ---------------- */

function escapeHtml(text) {
  const div = document.createElement("div");
  div.innerText = text;
  return div.innerHTML;
}

/* ---------------- ACTION BUTTONS ---------------- */

function createActions(data) {
  const box = document.getElementById("actions");
  box.innerHTML = "";

  if (data.startsWith("http")) {
    addButton(box, "🌐 Open Link", () => window.open(data, "_blank"));
  }

  if (data.startsWith("upi://")) {
    addButton(box, "💰 Pay", () => window.location.href = data);
  }

  addButton(box, "📋 Copy", () => {
    navigator.clipboard.writeText(data);
    alert("Copied!");
  });

  addButton(box, "🔄 Scan Again", () => {
    box.innerHTML = "";
    document.getElementById("result").innerHTML = "Scanning...";
    startScanner();
  });
}

function addButton(parent, text, action) {
  const btn = document.createElement("button");
  btn.className = "action-btn";
  btn.innerText = text;
  btn.onclick = action;
  parent.appendChild(btn);
}

/* ---------------- HISTORY ---------------- */

function saveHistory(data, type) {
  scanHistory.unshift({
    text: data,
    type: type,
    time: new Date().toLocaleString()
  });

  if (scanHistory.length > 20) scanHistory.pop();

  localStorage.setItem("scanHistory", JSON.stringify(scanHistory));
}

function renderHistory() {
  const box = document.getElementById("history");
  box.innerHTML = "<h3>History</h3>";

  scanHistory.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `${item.type}<br><small>${escapeHtml(item.text.substring(0, 30))}</small>`;
    div.onclick = () => handleResult(item.text);
    box.appendChild(div);
  });
}

/* ---------------- SERVICE WORKER ---------------- */

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .catch(err => console.log("SW error:", err));
}

/* ---------------- START ---------------- */

renderHistory();
initScanner();
</script>

</body>
</html>
