<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro QR Scanner</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

header{
padding:15px;
font-size:20px;
font-weight:bold;
background:#1e293b;
}

#reader{
width:90%;
margin:20px auto;
border-radius:15px;
overflow:hidden;
}

.controls{
margin:10px;
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
opacity:0.8;
}

#result{
margin:15px;
padding:15px;
background:#1e293b;
border-radius:10px;
word-wrap:break-word;
}

.action-btn {
display:block;
width:90%;
margin:8px auto;
padding:12px;
border:none;
border-radius:10px;
background:#1a73e8;
color:white;
font-size:16px;
cursor:pointer;
}

#installBtn{
display:none;
background:#16a34a;
}

.sidebar {
position:fixed;
right:0;
top:0;
width:240px;
height:100%;
overflow-y:auto;
background:#111;
padding:10px;
}

.history-item {
background:#1f1f1f;
padding:8px;
margin-bottom:8px;
border-radius:6px;
cursor:pointer;
font-size:13px;
}

.history-item:hover{
background:#2a2a2a;
}
</style>
</head>

<body>

<header>🚀 Pro QR Scanner</header>

<div id="reader"></div>

<div class="controls">
<button onclick="toggleFlash()">🔦 Flash</button>
<button onclick="switchCamera()">🔄 Camera</button>
<button onclick="scanFromGallery()">🖼 Gallery</button>
<button id="installBtn">📲 Install</button>
</div>

<div id="result">Scan Result Will Appear Here</div>
<div id="actions"></div>

<div class="sidebar" id="history"></div>

<script>
let html5QrCode;
let currentCameraId;
let cameras=[];
let scanHistory = JSON.parse(localStorage.getItem("scanHistory")) || [];
let deferredPrompt;

// PWA Install
window.addEventListener('beforeinstallprompt', (e) => {
e.preventDefault();
deferredPrompt = e;
document.getElementById("installBtn").style.display="inline-block";
});

document.getElementById("installBtn").addEventListener("click", async ()=>{
if(deferredPrompt){
deferredPrompt.prompt();
}
});

// Init Scanner
async function initScanner(){
html5QrCode = new Html5Qrcode("reader");
cameras = await Html5Qrcode.getCameras();
if(cameras.length){
currentCameraId = cameras[0].id;
startScanner();
}
}

function startScanner(){
html5QrCode.start(
currentCameraId,
{ fps:10, qrbox:250 },
onScanSuccess
);
}

function onScanSuccess(decodedText){
handleResult(decodedText);
html5QrCode.stop().then(()=>{});
}

// Flash
function toggleFlash(){
html5QrCode.applyVideoConstraints({
advanced:[{torch:true}]
});
}

// Switch Camera
function switchCamera(){
if(cameras.length>1){
currentCameraId = (currentCameraId===cameras[0].id)?cameras[1].id:cameras[0].id;
html5QrCode.stop().then(()=>startScanner());
}
}

// Gallery Scan
function scanFromGallery(){
html5QrCode.scanFileV2().then(result=>{
handleResult(result.decodedText);
});
}

// AI Analyze
function analyzeQR(data){
let d=data.toLowerCase();
if(d.startsWith("http")) return "🌐 Website";
if(d.startsWith("upi://")) return "💰 UPI Payment";
if(/^\+?\d{8,15}$/.test(data)) return "📞 Phone Number";
if(d.includes("@")) return "📧 Email";
return "📝 Text";
}

function handleResult(data){
let type=analyzeQR(data);

document.getElementById("result").innerHTML=
"<b>Result:</b><br>"+data+"<br><br><b>Type:</b> "+type;

createActions(data);
saveHistory(data,type);
renderHistory();
}

function createActions(data){
let box=document.getElementById("actions");
box.innerHTML="";

if(data.startsWith("http")){
box.innerHTML+=`<button class="action-btn" onclick="window.location='${data}'">🌐 Open Link</button>`;
}
if(data.startsWith("upi://")){
box.innerHTML+=`<button class="action-btn" onclick="window.location='${data}'">💰 Pay</button>`;
}
box.innerHTML+=`<button class="action-btn" onclick="navigator.clipboard.writeText('${data}')">📋 Copy</button>`;
box.innerHTML+=`<button class="action-btn" onclick="restartScan()">🔄 Scan Again</button>`;
}

function restartScan(){
document.getElementById("actions").innerHTML="";
document.getElementById("result").innerHTML="Scanning...";
startScanner();
}

// History
function saveHistory(data,type){
scanHistory.unshift({
text:data,
type:type,
time:new Date().toLocaleString()
});
if(scanHistory.length>20) scanHistory.pop();
localStorage.setItem("scanHistory",JSON.stringify(scanHistory));
}

function renderHistory(){
let box=document.getElementById("history");
box.innerHTML="<h3>History</h3>";
scanHistory.forEach(item=>{
box.innerHTML+=`
<div class="history-item" onclick="handleResult('${item.text}')">
${item.type}<br><small>${item.text.substring(0,30)}</small>
</div>`;
});
}

renderHistory();
initScanner();

// Service Worker
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
