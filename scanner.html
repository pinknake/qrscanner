<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkScanner Pro</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
margin:0;
background:#000;
color:#00ff88;
font-family:monospace;
display:flex;
flex-direction:column;
align-items:center;
}

h1{
text-shadow:0 0 10px #00ff88;
}

#reader{
width:90%;
max-width:400px;
margin-top:10px;
border:2px solid #00ff88;
box-shadow:0 0 20px #00ff88;
}

button{
background:#001a00;
color:#00ff88;
border:1px solid #00ff88;
padding:10px 15px;
margin:5px;
cursor:pointer;
box-shadow:0 0 10px #00ff88;
}

button:hover{
background:#003300;
}

#result{
margin-top:15px;
word-break:break-all;
text-align:center;
}

.history{
margin-top:20px;
width:90%;
max-width:400px;
border-top:1px solid #00ff88;
padding-top:10px;
}

.history-item{
font-size:12px;
margin-bottom:5px;
border-bottom:1px dashed #00ff88;
padding-bottom:3px;
}
</style>
</head>

<body>

<h1>DarkScanner Pro</h1>

<div id="reader"></div>

<div>
<button onclick="toggleTorch()">Torch</button>
<button onclick="scanImage()">Scan Image</button>
<button onclick="copyResult()">Copy</button>
<button onclick="shareResult()">Share</button>
<button id="installBtn" style="display:none;">Install</button>
</div>

<div id="result">No Scan Yet</div>

<div class="history" id="history"></div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>

let lastResult = "";
let html5QrCode = new Html5Qrcode("reader");
let torchOn = false;
let autoRedirect = true;

function startScanner(){
Html5Qrcode.getCameras().then(devices => {
if(devices && devices.length){
html5QrCode.start(
devices[0].id,
{ fps: 10, qrbox: 250 },
qrCodeMessage => {
if(qrCodeMessage !== lastResult){
lastResult = qrCodeMessage;
onScanSuccess(qrCodeMessage);
}
}
);
}
});
}

function onScanSuccess(message){

navigator.vibrate(200);
playBeep();

document.getElementById("result").innerHTML = 
detectURL(message);

saveHistory(message);

if(autoRedirect && isURL(message)){
setTimeout(()=>window.open(message,'_blank'),800);
}

}

function detectURL(text){
if(isURL(text)){
return `<a href="${text}" target="_blank" style="color:#00ff88">${text}</a>`;
}
return text;
}

function isURL(str){
return str.startsWith("http://") || str.startsWith("https://");
}

function copyResult(){
navigator.clipboard.writeText(lastResult);
alert("Copied!");
}

function shareResult(){
if(navigator.share){
navigator.share({ text:lastResult });
}
}

function toggleTorch(){
if(html5QrCode.getRunningTrackSettings){
const track = html5QrCode.getRunningTrackSettings();
if(track && track.torch){
html5QrCode.applyVideoConstraints({
advanced:[{torch: !torchOn}]
});
torchOn = !torchOn;
}
}
}

function scanImage(){
document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", e=>{
const file = e.target.files[0];
if(file){
html5QrCode.scanFile(file,true).then(decodedText=>{
onScanSuccess(decodedText);
});
}
});

function playBeep(){
let ctx = new AudioContext();
let oscillator = ctx.createOscillator();
oscillator.type="sine";
oscillator.frequency.setValueAtTime(1000, ctx.currentTime);
oscillator.connect(ctx.destination);
oscillator.start();
oscillator.stop(ctx.currentTime + 0.1);
}

function saveHistory(text){
let history = JSON.parse(localStorage.getItem("qrHistory") || "[]");
history.unshift(text);
history = history.slice(0,10);
localStorage.setItem("qrHistory", JSON.stringify(history));
renderHistory();
}

function renderHistory(){
let history = JSON.parse(localStorage.getItem("qrHistory") || "[]");
let container = document.getElementById("history");
container.innerHTML="";
history.forEach(item=>{
let div=document.createElement("div");
div.className="history-item";
div.innerText=item;
container.appendChild(div);
});
}

startScanner();
renderHistory();

/* Install button */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
e.preventDefault();
deferredPrompt = e;
document.getElementById("installBtn").style.display="inline-block";
});

document.getElementById("installBtn").addEventListener("click", ()=>{
if(deferredPrompt){
deferredPrompt.prompt();
}
});

</script>

</body>
</html>
